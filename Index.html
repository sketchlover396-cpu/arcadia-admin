
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcadia Admin Panel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b1020;color:#f1f5f9;font-family:Arial,sans-serif}
header{padding:22px;background:#131c30;border-bottom:1px solid #27334a}
header h1{color:#5eead4;letter-spacing:2px}
header p{color:#94a3b8;margin-top:6px}
nav{display:flex;flex-wrap:wrap;gap:8px;padding:14px;background:#111827}
nav button{padding:12px 16px;border:0;border-radius:8px;background:#263449;color:white}
nav button:active{background:#0d9488}
main{padding:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:14px;margin-top:20px}
.card{padding:20px;border:1px solid #263449;border-radius:12px;background:#131c30}
.card p{color:#94a3b8;font-size:14px;margin-bottom:12px}
.card h2{color:#5eead4;font-size:25px}
.panel{background:#131c30;border:1px solid #263449;padding:20px;border-radius:12px;margin-top:20px}
table{width:100%;border-collapse:collapse;margin-top:15px}
td,th{text-align:left;padding:12px;border-bottom:1px solid #263449}
th{color:#5eead4}
footer{text-align:center;color:#64748b;padding:25px}
</style>
</head>
<body>
<header>
<h1>ARCADIA</h1>
<p>Admin Control Center</p>
</header>
<nav>
<button onclick="page('dashboard')">Dashboard</button>
<button onclick="page('users')">Users</button>
<button onclick="page('games')">Games</button>
<button onclick="page('reports')">Reports</button>
<button onclick="page('settings')">Settings</button>
</nav>
<main id="app"></main>
<footer>ARCADIA ADMIN · DEMO PANEL</footer>
<script>
function page(p){
const a=document.getElementById('app');
if(p==='dashboard'){
a.innerHTML='<h2>Dashboard</h2><div class="cards"><div class="card"><p>Total Users</p><h2>1,248</h2></div><div class="card"><p>Active Users</p><h2>326</h2></div><div class="card"><p>Demo Games</p><h2>8</h2></div><div class="card"><p>Virtual Credits</p><h2>85,420</h2></div></div><div class="panel"><h3>System Overview</h3><p style="margin-top:15px;color:#94a3b8">Welcome to the Arcadia admin demo.</p></div>';
}
if(p==='users'){
a.innerHTML='<h2>User Management</h2><div class="panel"><table><tr><th>ID</th><th>User</th><th>Status</th></tr><tr><td>1001</td><td>User 01</td><td>Active</td></tr><tr><td>1002</td><td>User 02</td><td>Active</td></tr><tr><td>1003</td><td>User 03</td><td>Inactive</td></tr></table></div>';
}
if(p==='games'){
a.innerHTML='<h2>Game Management</h2><div class="panel"><table><tr><th>Game</th><th>Status</th></tr><tr><td>Game Alpha</td><td>Demo</td></tr><tr><td>Game Beta</td><td>Demo</td></tr><tr><td>Game Gamma</td><td>Demo</td></tr></table></div>';
}
if(p==='reports'){
a.innerHTML='<h2>Reports</h2><div class="panel"><h3>Analytics</h3><p style="margin-top:15px;color:#94a3b8">Demo analytics will appear here.</p></div>';
}
if(p==='settings'){
a.innerHTML='<h2>Settings</h2><div class="panel"><h3>System Configuration</h3><p style="margin-top:15px;color:#94a3b8">Demo configuration panel.</p><p style="margin-top:10px;color:#5eead4">Demo mode enabled</p></div>';
}
}
page('dashboard');
</script>
</body>
</html
